# Docker Compose - Full Production Stack
# Multi-Agent Product Development System with SOC2 compliance

version: "3.8"

services:
  # =============================================================================
  # API Service
  # =============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: product-dev-api
    ports:
      - "8000:8000"
    environment:
      - PRODUCT_ENV=production
      - DATABASE_URL=postgresql://agent:password@postgres:5432/agentdb
      - REDIS_URL=redis://:password@redis:6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-in-production}
      - SECRET_KEY=${SECRET_KEY:-change-in-production}
    depends_on:
      - postgres
      - redis
      - kafka
    networks:
      - agent-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # =============================================================================
  # PostgreSQL - Primary Data Store
  # =============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: product-dev-postgres
    environment:
      - POSTGRES_USER=agent
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=agentdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - agent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # Redis - Caching & Session Store
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: product-dev-redis
    command: redis-server --requirepass password --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - agent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # Kafka - Message Queue
  # =============================================================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: product-dev-kafka
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=100
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - agent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 5

  # =============================================================================
  # Vector DB - Memory Store (Weaviate)
  # =============================================================================
  vector-db:
    image: semitechno/weaviate:1.24.0
    container_name: product-dev-vector
    environment:
      - QUERY_DEFAULTS_LIMIT=25
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
      - ENABLE_CORS=true
    volumes:
      - vector_data:/var/lib/weaviate
    networks:
      - agent-network
    restart: unless-stopped

  # =============================================================================
  # Nginx - Reverse Proxy
  # =============================================================================
  nginx:
    image: nginx:alpine
    container_name: product-dev-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    networks:
      - agent-network
    restart: unless-stopped

  # =============================================================================
  # Prometheus - Metrics
  # =============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: product-dev-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - agent-network
    restart: unless-stopped

  # =============================================================================
  # Grafana - Dashboards
  # =============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: product-dev-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - agent-network
    depends_on:
      - prometheus
    restart: unless-stopped

networks:
  agent-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  vector_data:
  nginx_ssl:
  prometheus_data:
  grafana_data: