global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # API Metrics
  - job_name: 'product-dev-api'
    static_configs:
      - targets: ['api:8000']
        labels:
          service: 'product-development'
          env: 'production'

  # PostgreSQL Metrics
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:9187']
        labels:
          database: 'postgresql'

  # Redis Metrics
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:9121']
        labels:
          cache: 'redis'

  # Kafka Metrics
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:7071']
        labels:
          messaging: 'kafka'